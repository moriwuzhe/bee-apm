version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: bee-apm-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - bee-apm-network

  zookeeper:
    image: zookeeper:3.9
    container_name: bee-apm-zookeeper
    ports:
      - "2181:2181"
    networks:
      - bee-apm-network

  kafka:
    image: redpandadata/redpanda:latest
    container_name: bee-apm-kafka
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://127.0.0.1:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - 127.0.0.1:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - 127.0.0.1:33145
    volumes:
      - kafka_data:/var/lib/redpanda/data
    networks:
      - bee-apm-network

  bistoury-backend:
    build:
      context: ./bistoury
      dockerfile: docker/Dockerfile-backend
    container_name: bistoury-backend
    restart: always
    ports:
      - "8080:8080"   # API端口
      - "3333:3333"   # Agent通信端口
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      ZOOKEEPER_ADDRESS: zookeeper:2181
    volumes:
      - backend_logs:/app/logs
    depends_on:
      - zookeeper
    networks:
      - bee-apm-network

  bistoury-frontend:
    build:
      context: ./bistoury
      dockerfile: docker/Dockerfile-frontend
    container_name: bistoury-frontend
    restart: always
    ports:
      - "3000:80"    # 前端访问端口
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - bistoury-backend
    networks:
      - bee-apm-network

volumes:
  es_data:
  kafka_data:
  backend_logs:

networks:
  bee-apm-network:
    driver: bridge
