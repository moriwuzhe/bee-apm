<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <!-- 标题 -->
  <text x="500" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Code Analyzer 架构图</text>
  
  <!-- 前端层 -->
  <rect x="50" y="100" width="200" height="100" rx="5" fill="white" stroke="#667eea" stroke-width="2"/>
  <text x="150" y="130" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">前端层</text>
  <rect x="70" y="150" width="160" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="150" y="170" font-family="Arial" font-size="12" text-anchor="middle">HTML页面</text>
  <rect x="70" y="190" width="160" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="150" y="210" font-family="Arial" font-size="12" text-anchor="middle">JavaScript</text>
  
  <!-- 后端层 -->
  <rect x="300" y="100" width="200" height="100" rx="5" fill="white" stroke="#667eea" stroke-width="2"/>
  <text x="400" y="130" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">后端层</text>
  <rect x="320" y="150" width="160" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="400" y="170" font-family="Arial" font-size="12" text-anchor="middle">Spring Boot 控制器</text>
  <rect x="320" y="190" width="160" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="400" y="210" font-family="Arial" font-size="12" text-anchor="middle">Spring Boot 应用</text>
  
  <!-- 分析层 -->
  <rect x="550" y="100" width="200" height="150" rx="5" fill="white" stroke="#667eea" stroke-width="2"/>
  <text x="650" y="130" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">分析层</text>
  <rect x="570" y="150" width="160" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="650" y="170" font-family="Arial" font-size="12" text-anchor="middle">SpringBootProjectAnalyzer</text>
  <rect x="570" y="190" width="160" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="650" y="210" font-family="Arial" font-size="12" text-anchor="middle">JavaCodeIndexer</text>
  <rect x="570" y="230" width="160" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="650" y="250" font-family="Arial" font-size="12" text-anchor="middle">CodeIndexerFactory</text>
  
  <!-- 模型层 -->
  <rect x="800" y="100" width="150" height="150" rx="5" fill="white" stroke="#667eea" stroke-width="2"/>
  <text x="875" y="130" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">模型层</text>
  <rect x="820" y="150" width="110" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="875" y="170" font-family="Arial" font-size="12" text-anchor="middle">KnowledgeGraph</text>
  <rect x="820" y="190" width="110" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="875" y="210" font-family="Arial" font-size="12" text-anchor="middle">GraphNode</text>
  <rect x="820" y="230" width="110" height="30" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="875" y="250" font-family="Arial" font-size="12" text-anchor="middle">GraphEdge</text>
  
  <!-- 数据层 -->
  <rect x="250" y="300" width="500" height="150" rx="5" fill="white" stroke="#667eea" stroke-width="2"/>
  <text x="500" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">数据层</text>
  <rect x="270" y="350" width="140" height="80" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="340" y="390" font-family="Arial" font-size="12" text-anchor="middle">项目代码</text>
  <rect x="440" y="350" width="140" height="80" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="510" y="390" font-family="Arial" font-size="12" text-anchor="middle">Maven 配置</text>
  <rect x="610" y="350" width="140" height="80" rx="3" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="680" y="390" font-family="Arial" font-size="12" text-anchor="middle">应用配置</text>
  
  <!-- 箭头 -->
  <!-- 前端到后端 -->
  <path d="M250 170 L300 170" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="300,170 290,165 290,175" fill="#888888"/>
  <text x="275" y="160" font-family="Arial" font-size="10" text-anchor="middle">API 请求</text>
  
  <path d="M250 210 L300 210" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="300,210 290,205 290,215" fill="#888888"/>
  <text x="275" y="200" font-family="Arial" font-size="10" text-anchor="middle">API 请求</text>
  
  <!-- 后端到分析层 -->
  <path d="M500 170 L550 170" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="550,170 540,165 540,175" fill="#888888"/>
  <text x="525" y="160" font-family="Arial" font-size="10" text-anchor="middle">项目分析</text>
  
  <path d="M500 190 L550 190" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="550,190 540,185 540,195" fill="#888888"/>
  <text x="525" y="180" font-family="Arial" font-size="10" text-anchor="middle">代码索引</text>
  
  <!-- 后端到模型层 -->
  <path d="M500 130 L800 130" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="800,130 790,125 790,135" fill="#888888"/>
  <text x="650" y="120" font-family="Arial" font-size="10" text-anchor="middle">知识图谱操作</text>
  
  <!-- 分析层到数据层 -->
  <path d="M650 250 L650 300" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="650,300 645,290 655,290" fill="#888888"/>
  <text x="660" y="275" font-family="Arial" font-size="10" text-anchor="start">读取依赖</text>
  
  <path d="M650 270 L610 350" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="610,350 620,340 610,345" fill="#888888"/>
  <text x="630" y="310" font-family="Arial" font-size="10" text-anchor="start">读取配置</text>
  
  <path d="M650 290 L440 350" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="440,350 450,340 440,345" fill="#888888"/>
  <text x="545" y="320" font-family="Arial" font-size="10" text-anchor="middle">分析代码结构</text>
  
  <!-- JavaIndexer到数据层 -->
  <path d="M650 210 L270 350" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="270,350 280,340 270,345" fill="#888888"/>
  <text x="460" y="280" font-family="Arial" font-size="10" text-anchor="middle">解析代码</text>
  
  <!-- JavaIndexer到模型层 -->
  <path d="M750 190 L800 190" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="800,190 790,185 790,195" fill="#888888"/>
  <text x="775" y="180" font-family="Arial" font-size="10" text-anchor="middle">构建知识图谱</text>
  
  <path d="M750 210 L800 210" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="800,210 790,205 790,215" fill="#888888"/>
  <text x="775" y="200" font-family="Arial" font-size="10" text-anchor="middle">创建节点</text>
  
  <path d="M750 230 L800 230" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="800,230 790,225 790,235" fill="#888888"/>
  <text x="775" y="220" font-family="Arial" font-size="10" text-anchor="middle">创建边</text>
  
  <!-- CodeIndexerFactory到JavaIndexer -->
  <path d="M650 250 L650 190" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="650,190 645,200 655,200" fill="#888888"/>
  <text x="660" y="220" font-family="Arial" font-size="10" text-anchor="start">创建实例</text>
  
  <!-- Spring Boot应用到控制器 -->
  <path d="M400 190 L400 150" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="400,150 395,160 405,160" fill="#888888"/>
  <text x="410" y="170" font-family="Arial" font-size="10" text-anchor="start">初始化</text>
  
  <!-- 功能说明 -->
  <rect x="50" y="500" width="250" height="200" rx="5" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="175" y="520" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">前端功能</text>
  <text x="175" y="540" font-family="Arial" font-size="10" text-anchor="middle">包含多个标签页：</text>
  <text x="175" y="560" font-family="Arial" font-size="10" text-anchor="middle">- 项目概览</text>
  <text x="175" y="580" font-family="Arial" font-size="10" text-anchor="middle">- 交互导览</text>
  <text x="175" y="600" font-family="Arial" font-size="10" text-anchor="middle">- 使用向导</text>
  <text x="175" y="620" font-family="Arial" font-size="10" text-anchor="middle">- 业务文档</text>
  <text x="175" y="640" font-family="Arial" font-size="10" text-anchor="middle">- 深度分析</text>
  <text x="175" y="660" font-family="Arial" font-size="10" text-anchor="middle">- 知识图谱</text>
  
  <rect x="350" y="500" width="250" height="200" rx="5" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="475" y="520" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">API 接口</text>
  <text x="475" y="540" font-family="Arial" font-size="10" text-anchor="middle">提供 REST API 接口：</text>
  <text x="475" y="560" font-family="Arial" font-size="10" text-anchor="middle">- /api/code/projectAnalysis</text>
  <text x="475" y="580" font-family="Arial" font-size="10" text-anchor="middle">- /api/code/index</text>
  <text x="475" y="600" font-family="Arial" font-size="10" text-anchor="middle">- /api/code/graph</text>
  <text x="475" y="620" font-family="Arial" font-size="10" text-anchor="middle">- /api/code/context/{nodeId}</text>
  <text x="475" y="640" font-family="Arial" font-size="10" text-anchor="middle">- /api/code/impact/{nodeId}</text>
  
  <rect x="650" y="500" width="300" height="200" rx="5" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="800" y="520" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">分析功能</text>
  <text x="800" y="540" font-family="Arial" font-size="10" text-anchor="middle">负责项目分析：</text>
  <text x="800" y="560" font-family="Arial" font-size="10" text-anchor="middle">- Maven 依赖分析</text>
  <text x="800" y="580" font-family="Arial" font-size="10" text-anchor="middle">- 应用配置分析</text>
  <text x="800" y="600" font-family="Arial" font-size="10" text-anchor="middle">- 包结构分析</text>
  <text x="800" y="620" font-family="Arial" font-size="10" text-anchor="middle">- 控制器分析</text>
  <text x="800" y="640" font-family="Arial" font-size="10" text-anchor="middle">- 服务类分析</text>
  <text x="800" y="660" font-family="Arial" font-size="10" text-anchor="middle">- 数据访问层分析</text>
  <text x="800" y="680" font-family="Arial" font-size="10" text-anchor="middle">- 实体分析</text>
</svg>