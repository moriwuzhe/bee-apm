<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 1200px;
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 1.1rem;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .tab:hover {
            background: #e0e0e0;
        }
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .context-result {
            margin-top: 20px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f9f9f9;
            max-height: 400px;
            overflow-y: auto;
        }
        .context-result.show {
            animation: fadeIn 0.3s ease;
        }
        .node-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 14px;
        }
        .node-item.CLASS {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        .node-item.METHOD {
            background: #e8f5e8;
            border-left: 4px solid #4caf50;
        }
        .node-item.FIELD {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
        }
        .node-item.FILE {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
        }
        .edge-item {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            background: #f5f5f5;
            font-size: 14px;
        }
        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .graph-visual {
            margin-top: 20px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f9f9f9;
            min-height: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Code Analyzer</h1>
            <p>代码库知识图谱分析工具</p>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="index">索引代码库</button>
            <button class="tab" data-tab="context">Context 查询</button>
            <button class="tab" data-tab="impact">Impact Analysis</button>
            <button class="tab" data-tab="detect">Detect Changes</button>
            <button class="tab" data-tab="query">基础查询</button>
            <button class="tab" data-tab="apiRoute">API Route Map</button>
            <button class="tab" data-tab="mcp">MCP 工具</button>
            <button class="tab" data-tab="visualize">知识图谱可视化</button>
            <button class="tab" data-tab="chat">AI 聊天</button>
        </div>
        <!-- 索引代码库 -->
        <div id="index-tab" class="tab-content active">
            <div class="result-title">索引代码库</div>
            <div class="form-group">
                <label for="repoPath">代码库路径</label>
                <input type="text" id="repoPath" placeholder="输入代码库路径，例如 ./src" value="./src" />
            </div>
            <button id="indexBtn" onclick="indexRepository()">开始索引</button>
            <div id="indexStatus" class="status" style="margin-top:15px;"></div>
        </div>
        <!-- Context 查询 -->
        <div id="context-tab" class="tab-content">
            <div class="result-title">Context 查询</div>
            <div class="form-group">
                <label for="nodeId">节点 ID</label>
                <input type="text" id="nodeId" placeholder="输入节点 ID" />
            </div>
            <button id="contextBtn" onclick="getContext()">查询</button>
            <div id="contextStatus" class="status" style="margin-top:15px;"></div>
            <div id="contextResult" class="context-result" style="margin-top:20px;"></div>
        </div>
        <!-- Impact Analysis -->
        <div id="impact-tab" class="tab-content">
            <div class="result-title">Impact Analysis</div>
            <div class="form-group">
                <label for="impactNodeId">节点 ID</label>
                <input type="text" id="impactNodeId" placeholder="输入节点 ID" />
            </div>
            <button id="impactBtn" onclick="getImpact()">分析</button>
            <div id="impactStatus" class="status" style="margin-top:15px;"></div>
            <div id="impactResult" class="context-result" style="margin-top:20px;"></div>
        </div>
        <!-- Detect Changes -->
        <div id="detect-tab" class="tab-content">
            <div class="result-title">Detect Changes</div>
            <div class="form-group">
                <label for="changedFiles">变更文件（每行一个）</label>
                <textarea id="changedFiles" placeholder="./src/main/java/org/xi/lt/code/controller/CodeAnalyzerController.java" rows="5"></textarea>
            </div>
            <button id="detectBtn" onclick="detectChanges()">检测</button>
            <div id="detectStatus" class="status" style="margin-top:15px;"></div>
            <div id="detectResult" class="context-result" style="margin-top:20px;"></div>
        </div>
        <!-- 基础查询 -->
        <div id="query-tab" class="tab-content">
            <div class="result-title">基础查询</div>
            <div class="form-group">
                <label for="nodeType">节点类型</label>
                <select id="nodeType" style="width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;">
                    <option value="">全部</option>
                    <option value="FILE">文件</option>
                    <option value="CLASS">类</option>
                    <option value="INTERFACE">接口</option>
                    <option value="METHOD">方法</option>
                    <option value="FIELD">字段</option>
                </select>
            </div>
            <div class="form-group">
                <label for="nameContains">名称包含</label>
                <input type="text" id="nameContains" placeholder="输入关键词" />
            </div>
            <button id="queryBtn" onclick="doQuery()">查询</button>
            <div id="queryStatus" class="status" style="margin-top:15px;"></div>
            <div id="queryResult" class="context-result" style="margin-top:20px;"></div>
        </div>
        <!-- API Route Map -->
        <div id="apiRoute-tab" class="tab-content">
            <div class="result-title">API 路由映射</div>
            <button id="apiRouteBtn" onclick="getApiRouteMap()">获取 API 路由映射</button>
            <div id="apiRouteStatus" class="status" style="margin-top:15px;"></div>
            <div id="apiRouteResult" class="context-result" style="margin-top:20px;"></div>
        </div>
        <!-- MCP 工具 -->
        <div id="mcp-tab" class="tab-content">
            <div class="result-title">MCP 工具 - 代码查询</div>
            <div class="form-group">
                <label for="mcpQueryType">查询类型</label>
                <select id="mcpQueryType" style="width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;">
                    <option value="findClass">查找类</option>
                    <option value="findMethod">查找方法</option>
                    <option value="findField">查找字段</option>
                    <option value="findUsage">查找使用</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mcpQuery">查询关键词</label>
                <input type="text" id="mcpQuery" placeholder="输入关键词" />
            </div>
            <button id="mcpBtn" onclick="doMCPQuery()">查询</button>
            <div id="mcpStatus" class="status" style="margin-top:15px;"></div>
            <div id="mcpResult" class="context-result" style="margin-top:20px;"></div>
        </div>
        <!-- 知识图谱可视化 -->
        <div id="visualize-tab" class="tab-content">
            <div class="result-title">知识图谱可视化</div>
            <div id="graphVisual" class="graph-visual">
                <div>正在加载知识图谱...</div>
            </div>
        </div>
        <!-- AI 聊天 -->
        <div id="chat-tab" class="tab-content">
            <div class="result-title">AI 聊天</div>
            <div style="height:400px;border:2px solid #e0e0e0;border-radius:10px;padding:15px;background:#f8f9ff;overflow-y:auto;margin-bottom:15px;">
                <div id="chatMessages"></div>
            </div>
            <div style="display:flex;gap:10px;">
                <input type="text" id="chatInput" placeholder="输入您的问题..." style="flex:1;" />
                <button id="chatBtn" onclick="sendChatMessage()">发送</button>
            </div>
        </div>
    </div>
    <script>
        // 全局变量，用于存储知识图谱
        let graph = null;

        // 标签页切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // 移除所有标签页的 active 类
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                // 添加当前标签页的 active 类
                this.classList.add('active');
                const tabId = this.dataset.tab;
                document.getElementById(`${tabId}-tab`).classList.add('active');
                // 如果切换到可视化标签页，加载知识图谱
                if (tabId === 'visualize') {
                    loadGraphVisual();
                }
            });
        });

        // 索引代码库
        async function indexRepository() {
            const repoPath = document.getElementById('repoPath').value;
            const btn = document.getElementById('indexBtn');
            const status = document.getElementById('indexStatus');

            btn.disabled = true;
            status.style.display = 'none';

            try {
                const res = await fetch('/api/code/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repoPath })
                });
                const data = await res.json();

                if (data.success) {
                    status.className = 'status success';
                    status.textContent = `索引成功：${data.nodeCount} 个节点，${data.edgeCount} 条边`;
                    status.style.display = 'block';
                    // 加载知识图谱
                    await loadGraph();
                } else {
                    status.className = 'status error';
                    status.textContent = `索引失败：${data.error}`;
                    status.style.display = 'block';
                }
            } catch (e) {
                status.className = 'status error';
                status.textContent = `请求失败：${e.message}`;
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

        // 加载知识图谱
        async function loadGraph() {
            try {
                const res = await fetch('/api/code/graph');
                graph = await res.json();
            } catch (e) {
                console.error('加载知识图谱失败:', e);
            }
        }

        // 加载知识图谱可视化
        function loadGraphVisual() {
            const container = document.getElementById('graphVisual');
            if (!graph || !graph.nodes) {
                container.innerHTML = '<div style="color:#999;">请先索引代码库</div>';
                return;
            }

            // 计算节点类型分布
            const typeCount = {};
            for (const nodeId in graph.nodes) {
                const node = graph.nodes[nodeId];
                if (node.type) {
                    typeCount[node.type] = (typeCount[node.type] || 0) + 1;
                }
            }

            // 构建节点类型分布的 HTML
            let typeDistributionHtml = '';
            for (const type in typeCount) {
                typeDistributionHtml += '<div>' + type + ': ' + typeCount[type] + '</div>';
            }

            // 简单的可视化实现
            container.innerHTML = `
                <div style="font-weight:600;margin-bottom:15px;">知识图谱可视化</div>
                <div style="font-size:14px;">
                    <div>节点数：${Object.keys(graph.nodes).length}</div>
                    <div>边数：${graph.edges ? graph.edges.length : 0}</div>
                    <div style="margin-top:10px;">节点类型分布：</div>
                    ${typeDistributionHtml}
                </div>
            `;
        }

        // Context 查询
        async function getContext() {
            const nodeId = document.getElementById('nodeId').value;
            const btn = document.getElementById('contextBtn');
            const status = document.getElementById('contextStatus');
            const result = document.getElementById('contextResult');

            btn.disabled = true;
            status.style.display = 'none';
            result.classList.remove('show');

            try {
                const res = await fetch(`/api/code/context/${nodeId}`);
                const data = await res.json();

                if (data.error) {
                    status.className = 'status error';
                    status.textContent = `查询失败：${data.error}`;
                    status.style.display = 'block';
                } else {
                    result.innerHTML = `
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">节点信息：</div>
                            <div>ID: ${data.node.id}</div>
                            <div>类型: ${data.node.type}</div>
                            <div>名称: ${data.node.name}</div>
                            ${data.node.qualifiedName ? `<div>完整名称: ${data.node.qualifiedName}</div>` : ''}
                        </div>
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">入边（谁调用/包含它）：</div>
                            ${data.incomingEdges.map(e => `<div class="edge-item">${e.type} from ${e.sourceId}</div>`).join('')}
                        </div>
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">出边（它调用/包含谁）：</div>
                            ${data.outgoingEdges.map(e => `<div class="edge-item">${e.type} to ${e.targetId}</div>`).join('')}
                        </div>
                    `;
                    result.classList.add('show');
                }
            } catch (e) {
                status.className = 'status error';
                status.textContent = `请求失败：${e.message}`;
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

        // Impact Analysis
        async function getImpact() {
            const nodeId = document.getElementById('impactNodeId').value;
            const btn = document.getElementById('impactBtn');
            const status = document.getElementById('impactStatus');
            const result = document.getElementById('impactResult');

            btn.disabled = true;
            status.style.display = 'none';
            result.classList.remove('show');

            try {
                const res = await fetch(`/api/code/impact/${nodeId}`);
                const data = await res.json();

                if (data.error) {
                    status.className = 'status error';
                    status.textContent = `分析失败：${data.error}`;
                    status.style.display = 'block';
                } else {
                    result.innerHTML = `
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">节点信息：</div>
                            <div>ID: ${data.node.id}</div>
                            <div>类型: ${data.node.type}</div>
                            <div>名称: ${data.node.name}</div>
                        </div>
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">上游影响（谁调用它）：</div>
                            ${data.upstreamImpact.map(n => `<div class="node-item ${n.type}">${n.qualifiedName || n.name}</div>`).join('')}
                        </div>
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">下游影响（它调用谁）：</div>
                            ${data.downstreamImpact.map(n => `<div class="node-item ${n.type}">${n.qualifiedName || n.name}</div>`).join('')}
                        </div>
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">风险评估：</div>
                            <div>总影响数：${data.totalImpactCount}</div>
                            <div>风险等级：${data.riskLevel}</div>
                        </div>
                    `;
                    result.classList.add('show');
                }
            } catch (e) {
                status.className = 'status error';
                status.textContent = `请求失败：${e.message}`;
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

        // Detect Changes
        async function detectChanges() {
            const changedFiles = document.getElementById('changedFiles').value.split('\n').filter(f => f.trim());
            const btn = document.getElementById('detectBtn');
            const status = document.getElementById('detectStatus');
            const result = document.getElementById('detectResult');

            btn.disabled = true;
            status.style.display = 'none';
            result.classList.remove('show');

            try {
                const res = await fetch('/api/code/detectChanges', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ changedFiles })
                });
                const data = await res.json();

                if (data.error) {
                    status.className = 'status error';
                    status.textContent = `检测失败：${data.error}`;
                    status.style.display = 'block';
                } else {
                    result.innerHTML = `
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">变更的节点：</div>
                            ${data.changedNodes.map(n => `<div class="node-item ${n.type}">${n.qualifiedName || n.name}</div>`).join('')}
                        </div>
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">受影响的节点：</div>
                            ${data.impactedNodes.map(n => `<div class="node-item ${n.type}">${n.qualifiedName || n.name}</div>`).join('')}
                        </div>
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">风险评估：</div>
                            <div>总影响数：${data.totalImpactCount}</div>
                            <div>风险等级：${data.riskLevel}</div>
                        </div>
                    `;
                    result.classList.add('show');
                }
            } catch (e) {
                status.className = 'status error';
                status.textContent = `请求失败：${e.message}`;
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

        // 基础查询
        async function doQuery() {
            const nodeType = document.getElementById('nodeType').value;
            const nameContains = document.getElementById('nameContains').value;
            const btn = document.getElementById('queryBtn');
            const status = document.getElementById('queryStatus');
            const result = document.getElementById('queryResult');

            btn.disabled = true;
            status.style.display = 'none';
            result.classList.remove('show');

            try {
                const res = await fetch('/api/code/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nodeType, nameContains })
                });
                const data = await res.json();

                if (data.error) {
                    status.className = 'status error';
                    status.textContent = `查询失败：${data.error}`;
                    status.style.display = 'block';
                } else {
                    result.innerHTML = `
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">查询结果：${data.nodeCount} 个</div>
                        </div>
                        <div class="node-list">
                            ${data.nodes.map(n => `<div class="node-item ${n.type}">${n.qualifiedName || n.name}</div>`).join('')}
                        </div>
                    `;
                    result.classList.add('show');
                }
            } catch (e) {
                status.className = 'status error';
                status.textContent = `请求失败：${e.message}`;
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

        // API Route Map
        async function getApiRouteMap() {
            const btn = document.getElementById('apiRouteBtn');
            const status = document.getElementById('apiRouteStatus');
            const result = document.getElementById('apiRouteResult');

            btn.disabled = true;
            status.style.display = 'none';
            result.classList.remove('show');

            try {
                const res = await fetch('/api/code/apiRouteMap');
                const data = await res.json();

                if (data.error) {
                    status.className = 'status error';
                    status.textContent = `获取失败：${data.error}`;
                    status.style.display = 'block';
                } else {
                    result.innerHTML = `
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">API 路由映射：${data.routeCount} 个</div>
                        </div>
                        <div style="display:grid;gap:10px;">
                            ${data.apiRoutes.map(route => `
                                <div class="edge-item">
                                    <strong>路由：</strong>${route.route}<br>
                                    <strong>控制器：</strong>${route.controllerClass}<br>
                                    <strong>方法：</strong>${route.methodName}
                                </div>
                            `).join('')}
                        </div>
                    `;
                    result.classList.add('show');
                }
            } catch (e) {
                status.className = 'status error';
                status.textContent = `请求失败：${e.message}`;
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

        // MCP 工具
        async function doMCPQuery() {
            const queryType = document.getElementById('mcpQueryType').value;
            const query = document.getElementById('mcpQuery').value;
            const btn = document.getElementById('mcpBtn');
            const status = document.getElementById('mcpStatus');
            const result = document.getElementById('mcpResult');

            btn.disabled = true;
            status.style.display = 'none';
            result.classList.remove('show');

            try {
                const res = await fetch('/api/code/mcp/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ queryType, query })
                });
                const data = await res.json();

                if (data.error) {
                    status.className = 'status error';
                    status.textContent = `查询失败：${data.error}`;
                    status.style.display = 'block';
                } else {
                    result.innerHTML = `
                        <div style="margin-bottom:15px;">
                            <div style="font-weight:600;">查询结果：${data.resultCount} 个</div>
                        </div>
                        <div class="node-list">
                            ${data.results.map(n => `<div class="node-item ${n.type}">${n.qualifiedName || n.name}</div>`).join('')}
                        </div>
                    `;
                    result.classList.add('show');
                }
            } catch (e) {
                status.className = 'status error';
                status.textContent = `请求失败：${e.message}`;
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

        // 发送聊天消息
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `
                <div style="margin-bottom:10px;">
                    <div style="font-weight:600;">您：</div>
                    <div style="background:white;padding:10px;border-radius:8px;">${message}</div>
                </div>
            `;
            input.value = '';

            // 模拟 AI 回复
            setTimeout(() => {
                chatMessages.innerHTML += `
                    <div style="margin-bottom:10px;">
                        <div style="font-weight:600;">AI：</div>
                        <div style="background:#e3f2fd;padding:10px;border-radius:8px;">这是一个模拟的 AI 回复。在实际应用中，这里会调用真实的 AI 服务来生成回复。</div>
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 页面加载时加载知识图谱
        window.onload = async function() {
            await loadGraph();
        };
    </script>
</body>
</html>
