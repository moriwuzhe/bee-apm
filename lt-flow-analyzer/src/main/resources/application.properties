# 流程图分析器配置
server.port=8082
server.servlet.context-path=/

# 应用名称
spring.application.name=flow-analyzer

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# 上传目录配置
flow.upload.dir=./uploads

# Git 仓库目录配置
flow.git.repos.dir=./git-repos

# JAR 文件目录配置
flow.jar.dir=./jar-files

# 本地源码目录配置
flow.local.source.dir=./local-sources

# 工作目录配置（本地项目扫描）
flow.work.dir=.

# 日志配置
logging.level.org.xi.lt.flow=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
