server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: lt-monitor-server
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:h2:mem:lt_apm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
lt:
  handlers:
    flow: json>store
  store:
    name: h2  # 可选: h2, elasticsearch, mysql
    
    # Elasticsearch 配置
    elasticsearch:
      urls: http://localhost:9200
      username: 
      password: 
      indices:
        default: lt-default
        span: lt-apm-span
        log: lt-apm-log
      http:
        max-total-connection: 100
        default-max-per-route: 20
        conn-timeout: 5000
        read-timeout: 30000
        max-connection-idle-time: 60
      discovery:
        enabled: false
        frequency: 30000
    
    # MySQL 配置
    mysql:
      url: jdbc:mysql://localhost:3306/lt_apm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      username: root
      password: 
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false

diagnostic:
  zk:
    enabled: false

# Zookeeper配置 (用于诊断代理节点注册)
zk:
  url: zookeeper:2181
  sessionTimeoutMs: 15000
  connectionTimeoutMs: 15000
  retryIntervalMs: 10000

# 诊断代理Agent通信端口
agent:
  port: 3333
  proxy: ws://%s:%s/ws

# Elasticsearch配置
elasticsearch:
  host: 127.0.0.1
  port: 9200
  scheme: http

# 日志配置
logging:
  level:
    org.xi.lt: INFO
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

grpc:
  server:
    port: 9998

