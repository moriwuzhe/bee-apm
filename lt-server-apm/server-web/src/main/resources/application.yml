server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: lt-monitor-server

diagnostic:
  zk:
    enabled: false

# Zookeeper配置 (用于诊断代理节点注册)
zk:
  url: zookeeper:2181
  sessionTimeoutMs: 15000
  connectionTimeoutMs: 15000
  retryIntervalMs: 10000

# 诊断代理Agent通信端口
agent:
  port: 3333
  proxy: ws://%s:%s/ws

# Elasticsearch配置
elasticsearch:
  host: 127.0.0.1
  port: 9200
  scheme: http

# 日志配置
logging:
  level:
    org.xi.lt: INFO
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
