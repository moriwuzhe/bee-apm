server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: lt-monitor-server

# Elasticsearch配置
elasticsearch:
  host: 127.0.0.1
  port: 9200
  scheme: http

# 日志配置
logging:
  level:
    org.xi.lt: INFO
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
