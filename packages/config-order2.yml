# Order 应用专属配置
projectCode: order
secretKey: 6dae60a9-15ff-4774-aec0-cac473221a53
secret: 6dae60a9-15ff-4774-aec0-cac473221a53

lt.app: order
lt.env: dev
lt.inst: test01
lt.port: 8081

plugins:
  process:
    enable: true
    spend: -1
    enableMethodSign: true
    param:
      enable: true
      excludeTypePrefix:
        - javax.
        - org.w3c
        - org.springframework
        - org.apache
      includePointMatches:
        - org.xi.lt.demo.*
