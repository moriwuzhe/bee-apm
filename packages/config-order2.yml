  servlet:
    enable: true
    enableReqParam: true
    enableReqBody: true
    enableReqHeaders: true
    enableRespBody: true
    spend: 1
    excludeUrlSuffix: .html,.jsp,hello2

  springTx:
    enable: true
    spend: 0

  thread:
    enable: true
    excludeClass:
      nameStartsWith:
        - org.apache.tomcat.util
