server:
  port: 8080

spring:
  application:
    name: lt-monitor-test-demo
  profiles:
    active: dev

# 关闭Nacos和Dubbo自动注册，方便本地测试
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    dubbo:
      enabled: false

# Sentinel 配置
feign:
  sentinel:
    enabled: true

# Redis配置（测试用本地Redis）
  redis:
    host: localhost
    port: 6379
    database: 0

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# RocketMQ配置（测试用本地）
rocketmq:
  name-server: localhost:9876
  producer:
    group: test-group

# XXL-Job配置
xxl:
  job:
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    executor:
      appname: test-demo
      port: 9999

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n"
